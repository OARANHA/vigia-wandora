name: Validate Vigia bootstrap

on:
  push:
    branches:
      - ops/validate-vigia-bootstrap
    paths:
      - .github/workflows/validate-vigia-bootstrap.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
    steps:
      - name: Checkout Vigia bootstrap
        uses: actions/checkout@v7.0.1
        with:
          ref: feat/vigia-bootstrap

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test environment
        run: cp .env.example .env.test

      - name: Check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build web
        run: pnpm turbo run build --filter @app/web
