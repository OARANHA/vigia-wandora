name: Import Latitude upstream

on:
  push:
    branches:
      - ops/import-latitude-upstream
    paths:
      - .github/workflows/import-latitude-upstream.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Import Latitude baseline without upstream workflow files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
          UPSTREAM_SHA: 93f0733dc7596005dcb061ca163a016d4d86e3e2
        run: |
          set -euo pipefail

          mkdir latitude-src
          cd latitude-src
          git init
          git remote add origin https://github.com/latitude-dev/latitude-llm.git
          git fetch --depth=1 origin "${UPSTREAM_SHA}"
          git checkout --detach FETCH_HEAD

          test "$(git rev-parse HEAD)" = "${UPSTREAM_SHA}"

          rm -rf .github/workflows
          rm -rf .git

          git init -b snapshot
          git config user.name "Vigia Upstream Import"
          git config user.email "vigia-upstream@users.noreply.github.com"
          git add -A
          git commit -m "chore(upstream): snapshot Latitude ${UPSTREAM_SHA} without workflows"

          git remote add vigia \
            "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git"

          git push vigia HEAD:refs/heads/upstream/latitude

          test -n "$(git ls-remote vigia refs/heads/upstream/latitude | awk '{print $1}')"

          echo "Imported Latitude baseline body; workflow files will be restored separately."
