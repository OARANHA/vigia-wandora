name: vigia

x-app-environment: &app-environment
  NODE_ENV: production
  LAT_CLICKHOUSE_URL: http://clickhouse:8123
  LAT_CLICKHOUSE_USER: vigia
  LAT_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
  LAT_CLICKHOUSE_DB: vigia
  LAT_CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  LAT_CLICKHOUSE_CLUSTER_ENABLED: "false"
  LAT_DATABASE_URL: postgres://vigia_app:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/vigia
  LAT_ADMIN_DATABASE_URL: postgres://vigia:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/vigia
  LAT_REDIS_HOST: redis
  LAT_REDIS_PORT: "6379"
  LAT_BULLMQ_HOST: redis-bullmq
  LAT_BULLMQ_PORT: "6379"
  LAT_TEMPORAL_ADDRESS: temporal:7233
  LAT_TEMPORAL_NAMESPACE: default
  LAT_TEMPORAL_TASK_QUEUE: latitude-workflows
  LAT_STORAGE_DRIVER: fs
  LAT_STORAGE_FS_ROOT: /var/lib/vigia/storage
  LAT_TELEMETRY_RETENTION_DAYS: "30"
  LAT_BILLING_ENABLED: "false"
  LAT_WEB_URL: https://vigia.wandora.com.br
  LAT_WEB_PORT: "3000"
  LAT_API_URL: https://vigia.wandora.com.br
  LAT_API_PORT: "3001"
  LAT_INGEST_URL: https://vigia.wandora.com.br
  LAT_INGEST_PORT: "3002"
  LAT_WORKERS_HEALTH_PORT: "9090"
  LAT_WORKFLOWS_HEALTH_PORT: "9091"
  LAT_TRUSTED_ORIGINS: https://vigia.wandora.com.br
  LAT_CORS_ALLOWED_ORIGINS: https://vigia.wandora.com.br
  LAT_MASTER_ENCRYPTION_KEY: ${LAT_MASTER_ENCRYPTION_KEY:?LAT_MASTER_ENCRYPTION_KEY is required}
  LAT_BETTER_AUTH_SECRET: ${LAT_BETTER_AUTH_SECRET:?LAT_BETTER_AUTH_SECRET is required}
  LAT_MAILPIT_HOST: mailpit
  LAT_MAILPIT_PORT: "1025"
  LAT_MAILPIT_FROM: noreply@vigia.wandora.com.br
  LAT_OSS_TELEMETRY_ENABLED: "false"
  LAT_LOG_LEVEL: info

x-app: &app
  restart: unless-stopped
  environment: *app-environment
  volumes:
    - vigia_storage:/var/lib/vigia/storage
  depends_on:
    migrations:
      condition: service_completed_successfully

services:
  web:
    <<: *app
    image: ghcr.io/oaranha/vigia-web:${VIGIA_IMAGE_TAG:?VIGIA_IMAGE_TAG is required}
    container_name: vigia-web
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - default
      - vigia-edge

  api:
    <<: *app
    image: ghcr.io/oaranha/vigia-api:${VIGIA_IMAGE_TAG:?VIGIA_IMAGE_TAG is required}
    container_name: vigia-api
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - default
      - vigia-edge

  ingest:
    <<: *app
    image: ghcr.io/oaranha/vigia-ingest:${VIGIA_IMAGE_TAG:?VIGIA_IMAGE_TAG is required}
    container_name: vigia-ingest
    expose:
      - "3002"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - default
      - vigia-edge

  workers:
    <<: *app
    image: ghcr.io/oaranha/vigia-workers:${VIGIA_IMAGE_TAG:?VIGIA_IMAGE_TAG is required}
    container_name: vigia-workers
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      migrations:
        condition: service_completed_successfully
      temporal:
        condition: service_started

  workflows:
    <<: *app
    image: ghcr.io/oaranha/vigia-workflows:${VIGIA_IMAGE_TAG:?VIGIA_IMAGE_TAG is required}
    container_name: vigia-workflows
    expose:
      - "9091"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      migrations:
        condition: service_completed_successfully
      temporal:
        condition: service_started

  migrations:
    image: ghcr.io/oaranha/vigia-migrations:${VIGIA_IMAGE_TAG:?VIGIA_IMAGE_TAG is required}
    container_name: vigia-migrations
    restart: "no"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    image: ghcr.io/oaranha/vigia-postgres:${VIGIA_IMAGE_TAG:?VIGIA_IMAGE_TAG is required}
    container_name: vigia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: vigia
      POSTGRES_RUNTIME_USER: vigia_app
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    command: postgres -c wal_level=logical
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia -d vigia"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  clickhouse:
    image: ghcr.io/oaranha/vigia-clickhouse:${VIGIA_IMAGE_TAG:?VIGIA_IMAGE_TAG is required}
    container_name: vigia-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: vigia
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DB: vigia
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user vigia --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    container_name: vigia-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis-bullmq:
    image: redis:7
    container_name: vigia-redis-bullmq
    restart: unless-stopped
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_bullmq_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: vigia-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: vigia
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility

  mailpit:
    image: axllent/mailpit:v1.24
    container_name: vigia-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"

volumes:
  postgres_data:
  clickhouse_data:
  redis_bullmq_data:
  vigia_storage:

networks:
  vigia-edge:
    external: true
    name: vigia-edge
