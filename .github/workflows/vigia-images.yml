name: Vigia container images

on:
  pull_request:
    paths:
      - Dockerfile
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - deploy/production/**
      - .github/workflows/vigia-images.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - deploy/production/**
      - .github/workflows/vigia-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vigia-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validate production Compose
    runs-on: ubuntu-latest
    env:
      VIGIA_IMAGE_TAG: sha-test
      POSTGRES_PASSWORD: 11111111111111111111111111111111
      POSTGRES_RUNTIME_PASSWORD: 22222222222222222222222222222222
      CLICKHOUSE_PASSWORD: 33333333333333333333333333333333
      LAT_MASTER_ENCRYPTION_KEY: 4444444444444444444444444444444444444444444444444444444444444444
      LAT_BETTER_AUTH_SECRET: 5555555555555555555555555555555555555555555555555555555555555555
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Compose
        run: docker compose -f deploy/production/compose.yml config --quiet

  registry:
    name: Pull published ${{ matrix.service }}
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingest, workers, workflows, web, migrations]
    steps:
      - name: Pull public main image without registry login
        run: docker pull ghcr.io/oaranha/vigia-${{ matrix.service }}:main

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingest, workers, workflows, web, migrations, postgres, clickhouse]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/oaranha/vigia-${{ matrix.service }}:sha-${{ github.sha }}
            ghcr.io/oaranha/vigia-${{ matrix.service }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/OARANHA/vigia-wandora
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Vigia ${{ matrix.service }}
          cache-from: type=gha,scope=vigia-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=vigia-${{ matrix.service }}
