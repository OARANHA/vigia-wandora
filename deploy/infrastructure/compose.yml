name: vigia-infrastructure

services:
  traefik:
    image: traefik:v3.7.13
    container_name: vigia-traefik
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --ping=true
      - --api.dashboard=false
      - --accesslog=true
      - --log.level=INFO
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?TRAEFIK_ACME_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_letsencrypt:/letsencrypt
      - ../production/traefik-vigia.yml:/etc/traefik/dynamic/vigia.yml:ro
    networks:
      - vigia-edge
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  traefik_letsencrypt:
    name: vigia_traefik_letsencrypt

networks:
  vigia-edge:
    external: true
    name: vigia-edge
