name: Vigia Slice Validation

on:
  push:
    branches:
      - feat/vigia-agent-otlp-onboarding

permissions:
  contents: read

jobs:
  check-slice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changed web files
        run: >
          pnpm --filter @app/web exec biome check
          src/lib/product.ts
          'src/routes/_authenticated/-components/create-project-modal.tsx'
          'src/routes/_authenticated/-lib/loader.ts'
          'src/routes/_authenticated/projects/$projectSlug/-components/onboarding-flow.tsx'
          'src/routes/_authenticated/projects/$projectSlug/-components/onboarding/onboarding-legacy-types.ts'
          'src/routes/_authenticated/projects/$projectSlug/-components/onboarding/onboarding-right-pane.tsx'
          'src/routes/_authenticated/projects/$projectSlug/-components/onboarding/steps/role-step.tsx'
          'src/routes/_authenticated/projects/$projectSlug/-components/traces-empty-onboarding.tsx'
          'src/routes/_authenticated/projects/$projectSlug/-components/vigia-connection-instructions.tsx'
          'src/routes/_authenticated/projects/$projectSlug/-components/vigia-connection.test.ts'
          'src/routes/_authenticated/projects/$projectSlug/-components/vigia-connection.ts'
          'src/routes/_authenticated/projects/$projectSlug/onboarding.tsx'

      - name: Check changed ingest files
        run: >
          pnpm --filter @app/ingest exec biome check
          src/middleware/project.test.ts
          src/middleware/project.ts
          src/routes/traces.ts

  typecheck:
    uses: ./.github/workflows/typecheck.yml
    with:
      ref: ${{ github.sha }}

  tests:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.sha }}

  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create production environment
        run: cp .env.example .env.production

      - name: Build Vigia surfaces
        run: pnpm turbo run build --filter=@app/web --filter=@app/ingest
