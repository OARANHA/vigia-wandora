name: Validate Latitude baseline

on:
  push:
    branches:
      - ops/validate-latitude-baseline
    paths:
      - .github/workflows/validate-latitude-baseline.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
    steps:
      - name: Checkout imported upstream baseline
        uses: actions/checkout@v7.0.1
        with:
          ref: upstream/latitude

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test environment
        run: cp .env.example .env.test

      - name: Build workspace
        run: pnpm build

      - name: Validate self-host Compose model
        run: |
          cp .env.example .env.production
          sed -i 's/^NODE_ENV=.*/NODE_ENV=production/' .env.production
          docker compose --env-file .env.production -f docker-stack.yml config --quiet
