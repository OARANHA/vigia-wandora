http:
  routers:
    vigia-ingest:
      rule: "Host(`vigia.wandora.com.br`) && Path(`/v1/traces`)"
      entryPoints:
        - websecure
      priority: 300
      tls:
        certResolver: letsencrypt
      service: vigia-ingest

    vigia-api:
      rule: "Host(`vigia.wandora.com.br`) && (PathPrefix(`/v1/`) || PathPrefix(`/.well-known/`))"
      entryPoints:
        - websecure
      priority: 200
      tls:
        certResolver: letsencrypt
      service: vigia-api

    vigia-web:
      rule: "Host(`vigia.wandora.com.br`)"
      entryPoints:
        - websecure
      priority: 100
      tls:
        certResolver: letsencrypt
      service: vigia-web

  services:
    vigia-web:
      loadBalancer:
        servers:
          - url: "http://vigia-web:3000"

    vigia-api:
      loadBalancer:
        servers:
          - url: "http://vigia-api:3001"

    vigia-ingest:
      loadBalancer:
        servers:
          - url: "http://vigia-ingest:3002"
