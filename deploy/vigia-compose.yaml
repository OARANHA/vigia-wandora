name: vigia

x-app-environment: &app-environment
  NODE_ENV: production

  LAT_WEB_URL: ${VIGIA_PUBLIC_URL}
  LAT_API_URL: ${VIGIA_PUBLIC_URL}
  LAT_INGEST_URL: ${VIGIA_PUBLIC_URL}
  LAT_TRUSTED_ORIGINS: ${VIGIA_PUBLIC_URL}
  LAT_CORS_ALLOWED_ORIGINS: ${VIGIA_PUBLIC_URL}

  LAT_WEB_PORT: "3000"
  LAT_API_PORT: "3001"
  LAT_INGEST_PORT: "3002"
  LAT_WORKERS_HEALTH_PORT: "9090"
  LAT_WORKFLOWS_HEALTH_PORT: "9091"

  LAT_DATABASE_URL: postgres://${POSTGRES_RUNTIME_USER}:${POSTGRES_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}
  LAT_ADMIN_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  LAT_PG_POOL_MAX: "20"
  LAT_PG_IDLE_TIMEOUT_MS: "30000"
  LAT_PG_CONNECT_TIMEOUT_MS: "10000"

  LAT_CLICKHOUSE_URL: http://clickhouse:8123
  LAT_CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  LAT_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  LAT_CLICKHOUSE_DB: ${CLICKHOUSE_DB}
  LAT_CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  LAT_CLICKHOUSE_CLUSTER_ENABLED: "false"

  LAT_REDIS_HOST: redis
  LAT_REDIS_PORT: "6379"
  LAT_BULLMQ_HOST: redis-bullmq
  LAT_BULLMQ_PORT: "6379"

  LAT_TEMPORAL_ADDRESS: temporal:7233
  LAT_TEMPORAL_NAMESPACE: default
  LAT_TEMPORAL_TASK_QUEUE: latitude-workflows

  LAT_STORAGE_DRIVER: fs
  LAT_STORAGE_FS_ROOT: /var/lib/vigia/storage

  LAT_MASTER_ENCRYPTION_KEY: ${LAT_MASTER_ENCRYPTION_KEY}
  LAT_BETTER_AUTH_SECRET: ${LAT_BETTER_AUTH_SECRET}
  LAT_REDACTION_PSEUDONYM_SECRET: ${LAT_REDACTION_PSEUDONYM_SECRET}

  LAT_MAILPIT_HOST: mailpit
  LAT_MAILPIT_PORT: "1025"
  LAT_MAILPIT_FROM: noreply@vigia.wandora.com.br

  LAT_BILLING_ENABLED: "false"
  LAT_OSS_TELEMETRY_ENABLED: "false"
  LAT_TELEMETRY_RETENTION_DAYS: "90"
  LAT_JEV_FLAGGER_PRECLASSIFIER_ENABLED: "false"
  LAT_LOG_LEVEL: info

x-app: &app
  restart: unless-stopped
  environment: *app-environment
  volumes:
    - vigia_storage:/var/lib/vigia/storage
  networks:
    - internal
  depends_on:
    migrations:
      condition: service_completed_successfully

services:
  web:
    <<: *app
    container_name: vigia-web
    image: ghcr.io/oaranha/vigia-web:${VIGIA_IMAGE_TAG}
    networks:
      - internal
      - wandora-edge
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$$LAT_WEB_PORT/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  api:
    <<: *app
    container_name: vigia-api
    image: ghcr.io/oaranha/vigia-api:${VIGIA_IMAGE_TAG}
    networks:
      - internal
      - wandora-edge
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$$LAT_API_PORT/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  ingest:
    <<: *app
    container_name: vigia-ingest
    image: ghcr.io/oaranha/vigia-ingest:${VIGIA_IMAGE_TAG}
    networks:
      - internal
      - wandora-edge
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$$LAT_INGEST_PORT/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  workers:
    <<: *app
    container_name: vigia-workers
    image: ghcr.io/oaranha/vigia-workers:${VIGIA_IMAGE_TAG}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$$LAT_WORKERS_HEALTH_PORT/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  workflows:
    <<: *app
    container_name: vigia-workflows
    image: ghcr.io/oaranha/vigia-workflows:${VIGIA_IMAGE_TAG}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$$LAT_WORKFLOWS_HEALTH_PORT/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  migrations:
    container_name: vigia-migrations
    image: ghcr.io/oaranha/vigia-migrations:${VIGIA_IMAGE_TAG}
    restart: "no"
    environment: *app-environment
    volumes:
      - vigia_storage:/var/lib/vigia/storage
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    container_name: vigia-postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  clickhouse:
    container_name: vigia-clickhouse
    image: clickhouse/clickhouse-server:26.2
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../docker/clickhouse/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
    networks:
      - internal
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    container_name: vigia-redis
    image: redis:7
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis-bullmq:
    container_name: vigia-redis-bullmq
    image: redis:7
    restart: unless-stopped
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_bullmq_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  temporal:
    container_name: vigia-temporal
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    container_name: vigia-mailpit
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres_data:
  clickhouse_data:
  redis_bullmq_data:
  vigia_storage:

networks:
  internal:
  wandora-edge:
    external: true
