name: vigia-infrastructure

services:
  traefik-config:
    image: alpine:3.22
    container_name: vigia-traefik-config
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        cat > /dynamic/vigia.yml <<'EOF'
        http:
          routers:
            vigia-ingest:
              rule: "Host(`vigia.wandora.com.br`) && Method(`POST`) && Path(`/v1/traces`)"
              entryPoints:
                - websecure
              priority: 300
              tls:
                certResolver: letsencrypt
              service: vigia-ingest

            vigia-api:
              rule: "Host(`vigia.wandora.com.br`) && (PathPrefix(`/v1/`) || PathPrefix(`/.well-known/`))"
              entryPoints:
                - websecure
              priority: 200
              tls:
                certResolver: letsencrypt
              service: vigia-api

            vigia-app:
              rule: "Host(`app-vigia.wandora.com.br`)"
              entryPoints:
                - websecure
              priority: 100
              tls:
                certResolver: letsencrypt
              service: vigia-web

            # Stage 2: o host público serve a landing. API, OTLP e discovery
            # continuam protegidos pelos routers de maior prioridade acima.
            vigia-landing:
              rule: "Host(`vigia.wandora.com.br`)"
              entryPoints:
                - websecure
              priority: 100
              tls:
                certResolver: letsencrypt
              service: vigia-landing

            # Ativar em produção somente com uma política de acesso administrativo
            # na borda (preferencialmente Cloudflare Access ou equivalente).
            vigia-ops:
              rule: "Host(`ops-vigia.wandora.com.br`)"
              entryPoints:
                - websecure
              priority: 100
              tls:
                certResolver: letsencrypt
              service: vigia-portainer

            studio-designer:
              rule: "Host(`designer-vigia.wandora.com.br`)"
              entryPoints:
                - websecure
              priority: 100
              tls:
                certResolver: letsencrypt
              service: studio-designer

            elus-app:
              rule: "Host(`elus.wandora.com.br`)"
              entryPoints:
                - websecure
              priority: 100
              tls:
                certResolver: letsencrypt
              service: elus-app

          services:
            vigia-web:
              loadBalancer:
                servers:
                  - url: "http://vigia-web:3000"

            vigia-landing:
              loadBalancer:
                servers:
                  - url: "http://vigia-landing:80"

            vigia-api:
              loadBalancer:
                servers:
                  - url: "http://vigia-api:3001"

            vigia-ingest:
              loadBalancer:
                servers:
                  - url: "http://vigia-ingest:3002"

            vigia-portainer:
              loadBalancer:
                serversTransport: vigia-portainer-tls
                servers:
                  - url: "https://vigia-portainer:9443"

            studio-designer:
              loadBalancer:
                servers:
                  - url: "http://wandora-studio-designer:3210"

            elus-app:
              loadBalancer:
                servers:
                  - url: "http://elus-app:3000"

          serversTransports:
            vigia-portainer-tls:
              insecureSkipVerify: true
        EOF
    volumes:
      - traefik_dynamic:/dynamic

  traefik:
    image: traefik:v3.7.13
    container_name: vigia-traefik
    restart: unless-stopped
    depends_on:
      traefik-config:
        condition: service_completed_successfully
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --ping=true
      - --api.dashboard=false
      - --accesslog=true
      - --log.level=INFO
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?TRAEFIK_ACME_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_letsencrypt:/letsencrypt
      - traefik_dynamic:/etc/traefik/dynamic:ro
    networks:
      - vigia-edge
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  traefik_letsencrypt:
    name: vigia_traefik_letsencrypt
  traefik_dynamic:
    name: vigia_traefik_dynamic

networks:
  vigia-edge:
    external: true
    name: vigia-edge
